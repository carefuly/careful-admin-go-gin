basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      password:
        description: 密码
        maxLength: 50
        minLength: 6
        type: string
      username:
        description: 用户名
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      expire:
        description: 过期时间(秒)
        type: integer
      token:
        description: JWT令牌
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.User'
        description: 用户信息
    type: object
  auth.RefreshTokenRequest:
    properties:
      token:
        description: 旧的JWT令牌
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6Ikp...
        type: string
    required:
    - token
    type: object
  dept.Type:
    enum:
    - company
    - department
    - team
    - other
    type: string
    x-enum-comments:
      TypeCompany: 公司
      TypeDepartment: 部门
      TypeOther: 其他
      TypeTeam: 小组
    x-enum-varnames:
    - TypeCompany
    - TypeDepartment
    - TypeTeam
    - TypeOther
  github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.Dept:
    properties:
      belong_dept:
        description: 数据归属部门
        type: string
      code:
        description: 部门编码
        type: string
      createTime:
        description: 创建时间
        type: string
      creator:
        description: 创建人
        type: string
      dept_type:
        allOf:
        - $ref: '#/definitions/dept.Type'
        description: 部门类型
      description:
        description: 部门描述
        type: string
      email:
        description: 部门邮箱
        type: string
      id:
        description: 主键ID(自增)
        type: string
      level:
        description: 关联查询字段
        type: integer
      modifier:
        description: 修改人
        type: string
      name:
        description: 部门名称
        type: string
      owner:
        description: 部门负责人
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_model_careful_system.Dept'
        description: 父部门
      parent_id:
        description: 上级部门
        type: string
      path:
        description: 部门路径，格式：/1/2/3/
        type: string
      phone:
        description: 部门电话
        type: string
      remark:
        description: 备注
        type: string
      sort:
        description: 显示排序
        type: integer
      status:
        description: 状态
        type: boolean
      timestamp:
        description: 版本号(时间戳)
        type: integer
      updateTime:
        description: 更新时间
        type: string
    type: object
  github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.User:
    properties:
      address:
        description: 详细地址
        type: string
      avatar:
        description: 头像
        type: string
      belong_dept:
        description: 数据归属部门
        type: string
      bio:
        description: 个人简介
        type: string
      birthday:
        description: 生日
        type: string
      city:
        description: 所在城市
        type: string
      createTime:
        description: 创建时间
        type: string
      creator:
        description: 创建人
        type: string
      dept:
        allOf:
        - $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_model_careful_system.Dept'
        description: 部门
      dept_id:
        description: 部门ID
        type: string
      email:
        description: 邮箱
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/user.GenderConst'
        description: 性别
      id:
        description: 主键ID(自增)
        type: string
      is_superuser:
        description: 是否为超级管理员
        type: boolean
      last_login:
        description: 最后登录时间
        type: string
      last_login_ip:
        description: 最后登录IP
        type: string
      mobile:
        description: 手机号
        type: string
      modifier:
        description: 修改人
        type: string
      name:
        description: 真实姓名
        type: string
      remark:
        description: 备注
        type: string
      sort:
        description: 显示排序
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/user.Status'
        description: 状态
      timestamp:
        description: 版本号(时间戳)
        type: integer
      updateTime:
        description: 更新时间
        type: string
      username:
        description: 用户名
        type: string
    type: object
  github_com_carefuly_careful-admin-go-gin_internal_model_careful_system.Dept:
    properties:
      belong_dept:
        description: 数据归属部门
        type: string
      code:
        description: 部门编码
        type: string
      creator:
        description: 创建人
        type: string
      dept_type:
        allOf:
        - $ref: '#/definitions/dept.Type'
        description: 部门类型
      description:
        description: 部门描述
        type: string
      email:
        description: 部门邮箱
        type: string
      id:
        description: 主键ID(自增)
        type: string
      level:
        description: 关联查询字段
        type: integer
      modifier:
        description: 修改人
        type: string
      name:
        description: 部门名称
        type: string
      owner:
        description: 部门负责人
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_model_careful_system.Dept'
        description: 父部门
      parent_id:
        description: 上级部门
        type: string
      path:
        description: 部门路径，格式：/1/2/3/
        type: string
      phone:
        description: 部门电话
        type: string
      remark:
        description: 备注
        type: string
      sort:
        description: 显示排序
        type: integer
      status:
        description: 状态
        type: boolean
      timestamp:
        description: 版本号(时间戳)
        type: integer
    type: object
  response.Response:
    properties:
      code:
        description: HTTP状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 提示信息
      request_id:
        description: 请求ID
        type: string
      status:
        description: '响应状态: success|error'
        type: string
      timestamp:
        description: 时间戳
        type: string
    type: object
  system.CreateDeptRequest:
    properties:
      code:
        description: 部门编码
        maxLength: 50
        type: string
      dept_type:
        allOf:
        - $ref: '#/definitions/dept.Type'
        default: department
        description: 部门类型
        maxLength: 20
      description:
        description: 部门描述
        type: string
      email:
        description: 部门邮箱
        maxLength: 64
        type: string
      name:
        description: 部门名称
        maxLength: 50
        type: string
      owner:
        description: 部门负责人
        maxLength: 64
        type: string
      parent_id:
        description: 父部门ID
        maxLength: 110
        type: string
      phone:
        description: 部门电话
        maxLength: 64
        type: string
      remark:
        description: 备注
        maxLength: 255
        type: string
      sort:
        default: 1
        description: 排序
        type: integer
      status:
        default: true
        description: 状态【true-启用 false-停用】
        type: boolean
    required:
    - code
    - name
    type: object
  system.UpdateDeptRequest:
    properties:
      code:
        description: 部门编码
        maxLength: 50
        type: string
      dept_type:
        allOf:
        - $ref: '#/definitions/dept.Type'
        default: department
        description: 部门类型
        maxLength: 20
      description:
        description: 部门描述
        type: string
      email:
        description: 部门邮箱
        maxLength: 64
        type: string
      id:
        description: 主键ID
        type: string
      name:
        description: 部门名称
        maxLength: 50
        type: string
      owner:
        description: 部门负责人
        maxLength: 64
        type: string
      parent_id:
        description: 父部门ID
        maxLength: 110
        type: string
      phone:
        description: 部门电话
        maxLength: 64
        type: string
      remark:
        description: 备注
        maxLength: 255
        type: string
      sort:
        default: 1
        description: 排序
        type: integer
      status:
        default: true
        description: 状态【true-启用 false-停用】
        type: boolean
      timestamp:
        description: 版本
        type: integer
    required:
    - code
    - id
    - name
    type: object
  user.GenderConst:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      GenderConstFemale: 女
      GenderConstMale: 男
      GenderConstSecret: 保密
    x-enum-varnames:
    - GenderConstMale
    - GenderConstFemale
    - GenderConstSecret
  user.Status:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      StatusDisabled: 禁用
      StatusLocked: 锁定
      StatusNormal: 正常
    x-enum-varnames:
    - StatusNormal
    - StatusDisabled
    - StatusLocked
externalDocs:
  description: 开源代码库
  url: https://github.com/carefuly/careful-admin-go-gin
host: localhost:8080
info:
  contact:
    email: 2224693191@qq.com
    name: CJiaの用心 - 技术支持
    url: http://www.swagger.io/support
  description: |-
    CarefulAdmin 是一个高效、安全的企业级后台管理系统，提供完整的权限管理和数据可视化功能。
    功能模块包括: 用户管理、角色管理、部门管理、菜单管理、操作日志和数据字典等。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms
  title: CarefulAdmin 后台管理系统 API
  version: 1.0.0
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登录
      parameters:
      - description: 参数信息
        in: body
        name: LoginRequest
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 账号密码登录
      tags:
      - 认证管理
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 用户退出登录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 退出登录
      tags:
      - 认证管理
  /v1/auth/profile:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 获取当前登录用户信息
      tags:
      - 认证管理
  /v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: 使用旧的JWT令牌获取新的令牌
      parameters:
      - description: 刷新令牌参数
        in: body
        name: RefreshTokenRequest
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新令牌
      tags:
      - 认证管理
  /v1/system/dept/batchDelete:
    post:
      consumes:
      - application/json
      description: 批量删除部门信息
      parameters:
      - description: id数组
        in: body
        name: ids
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 批量删除部门
      tags:
      - 系统管理/部门管理
  /v1/system/dept/create:
    post:
      consumes:
      - application/json
      description: 创建部门信息
      parameters:
      - description: 请求
        in: body
        name: CreateDeptRequest
        required: true
        schema:
          $ref: '#/definitions/system.CreateDeptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 创建部门
      tags:
      - 系统管理/部门管理
  /v1/system/dept/delete/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定id部门信息
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 删除部门
      tags:
      - 系统管理/部门管理
  /v1/system/dept/getById/{id}:
    get:
      consumes:
      - application/json
      description: 获取指定id部门信息
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.Dept'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 获取部门
      tags:
      - 系统管理/部门管理
  /v1/system/dept/listAll:
    get:
      consumes:
      - application/json
      description: 获取所有部门列表信息
      parameters:
      - description: 创建人
        in: query
        name: creator
        type: string
      - description: 修改人
        in: query
        name: modifier
        type: string
      - default: true
        description: 状态
        in: query
        name: status
        type: boolean
      - description: 部门名称
        in: query
        name: name
        type: string
      - description: 部门编码
        in: query
        name: code
        type: string
      - description: 部门类型
        in: query
        name: dept_type
        type: string
      - default: 0
        description: 层级深度
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/github_com_carefuly_careful-admin-go-gin_internal_domain_careful_system.Dept'
              type: array
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 获取所有部门
      tags:
      - 系统管理/部门管理
  /v1/system/dept/listTree:
    get:
      consumes:
      - application/json
      description: 获取部门树形结构信息
      parameters:
      - description: 创建人
        in: query
        name: creator
        type: string
      - description: 修改人
        in: query
        name: modifier
        type: string
      - default: true
        description: 状态
        in: query
        name: status
        type: boolean
      - description: 部门名称
        in: query
        name: name
        type: string
      - description: 部门编码
        in: query
        name: code
        type: string
      - description: 部门类型
        in: query
        name: dept_type
        type: string
      - default: 0
        description: 层级深度
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 获取部门树形结构
      tags:
      - 系统管理/部门管理
  /v1/system/dept/update:
    put:
      consumes:
      - application/json
      description: 更新部门信息
      parameters:
      - description: 请求
        in: body
        name: UpdateDeptRequest
        required: true
        schema:
          $ref: '#/definitions/system.UpdateDeptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      - LoginToken: []
      summary: 更新部门
      tags:
      - 系统管理/部门管理
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'JWT认证令牌，格式: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
